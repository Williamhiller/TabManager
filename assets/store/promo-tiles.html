<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Tab Groups Store Promo Tiles</title>
    <style>
      :root {
        --ink: #1f2933;
        --muted: #5f6c7b;
        --line: rgba(31, 41, 51, 0.12);
        --green: #244a1d;
        --leaf: #9bd16f;
        --mint: #dff3e5;
        --cyan: #52b7c8;
        --amber: #f4b84a;
        --coral: #e3655b;
        --paper: #f7faf6;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #ffffff;
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        width: 100vw;
        height: 100vh;
      }

      body.small {
        width: 440px;
        height: 280px;
      }

      body.marquee {
        width: 1400px;
        height: 560px;
      }

      .canvas {
        position: relative;
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        isolation: isolate;
      }

      .brand-lockup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: currentColor;
        font-size: 18px;
        font-weight: 760;
        letter-spacing: 0;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        object-fit: cover;
        box-shadow: 0 8px 22px rgba(23, 33, 43, 0.14);
      }

      .headline {
        margin: 0;
        letter-spacing: 0;
        font-weight: 820;
        line-height: 0.96;
      }

      .subhead {
        margin: 0;
        color: var(--muted);
        font-weight: 560;
        line-height: 1.32;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 28px;
        padding: 0 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 8px 18px rgba(31, 41, 51, 0.06);
        font-size: 13px;
        font-weight: 720;
        white-space: nowrap;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .mock-panel {
        position: absolute;
        border: 1px solid rgba(31, 41, 51, 0.1);
        background: rgba(255, 255, 255, 0.86);
        box-shadow:
          0 28px 70px rgba(31, 41, 51, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
      }

      .group-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-radius: 8px;
        border: 1px solid rgba(31, 41, 51, 0.08);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 10px 24px rgba(31, 41, 51, 0.07);
        color: var(--ink);
      }

      .group-copy {
        min-width: 0;
      }

      .group-copy strong {
        display: block;
        color: var(--ink);
        font-weight: 780;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .group-copy span {
        display: block;
        color: var(--muted);
        font-weight: 580;
        white-space: nowrap;
      }

      .count {
        display: inline-flex;
        min-width: 30px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #22341d;
        color: #ecf9df;
        font-size: 13px;
        font-weight: 780;
      }

      .variant-a {
        background:
          linear-gradient(90deg, rgba(155, 209, 111, 0.23) 1px, transparent 1px),
          linear-gradient(0deg, rgba(155, 209, 111, 0.2) 1px, transparent 1px),
          linear-gradient(135deg, #fbfff8 0%, #eef8ed 58%, #e4f5ee 100%);
        background-size: 34px 34px, 34px 34px, auto;
      }

      .variant-a::after {
        position: absolute;
        inset: auto -8% -42% 42%;
        width: 62%;
        height: 92%;
        content: "";
        border: 48px solid rgba(36, 74, 29, 0.08);
        border-radius: 40%;
        transform: rotate(-12deg);
        z-index: -1;
      }

      .variant-b {
        background:
          linear-gradient(120deg, rgba(82, 183, 200, 0.13), transparent 32%),
          linear-gradient(180deg, #f8fbff 0%, #eef6fb 100%);
      }

      .variant-b::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 12px 12px, rgba(31, 41, 51, 0.11) 1.4px, transparent 1.5px);
        background-size: 24px 24px;
        mask-image: linear-gradient(90deg, transparent 0%, black 18%, black 78%, transparent 100%);
        z-index: -1;
      }

      .variant-c {
        color: #f6f4e8;
        background:
          linear-gradient(90deg, rgba(82, 183, 200, 0.15) 1px, transparent 1px),
          linear-gradient(0deg, rgba(244, 184, 74, 0.12) 1px, transparent 1px),
          linear-gradient(135deg, #151a16 0%, #263324 50%, #111813 100%);
        background-size: 36px 36px, 36px 36px, auto;
      }

      .variant-c .subhead,
      .variant-c .group-copy span {
        color: rgba(246, 244, 232, 0.74);
      }

      .variant-c .group-copy strong {
        color: #f6f4e8;
      }

      .variant-c .pill {
        border-color: rgba(246, 244, 232, 0.18);
        background: rgba(246, 244, 232, 0.08);
        box-shadow: none;
      }

      .variant-c .mock-panel,
      .variant-c .group-card {
        border-color: rgba(246, 244, 232, 0.13);
        background: rgba(246, 244, 232, 0.08);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.24);
      }

      .variant-c .count {
        background: #9bd16f;
        color: #182316;
      }

      .small {
        --canvas-w: 440px;
        --canvas-h: 280px;
      }

      .small .brand-lockup {
        position: absolute;
        left: 24px;
        top: 22px;
        font-size: 14px;
      }

      .small .brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
      }

      .small .headline {
        position: absolute;
        left: 24px;
        top: 76px;
        max-width: 210px;
        font-size: 34px;
        line-height: 0.98;
      }

      .small .subhead {
        position: absolute;
        left: 25px;
        top: 160px;
        max-width: 205px;
        font-size: 13px;
        line-height: 1.24;
      }

      .small .pill-row {
        position: absolute;
        left: 24px;
        bottom: 22px;
        display: flex;
        gap: 8px;
      }

      .small .pill {
        font-size: 11px;
        min-height: 25px;
        padding: 0 9px;
      }

      .small .mock-panel {
        right: 18px;
        bottom: 22px;
        width: 164px;
        height: 170px;
        border-radius: 15px;
        padding: 11px;
      }

      .small .group-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .small .group-card {
        min-height: 33px;
        padding: 6px 7px;
      }

      .small .group-copy strong {
        font-size: 10px;
      }

      .small .group-copy span {
        max-width: 92px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 8px;
      }

      .small .count {
        min-width: 22px;
        height: 22px;
        font-size: 10px;
      }

      .marquee {
        --canvas-w: 1400px;
        --canvas-h: 560px;
      }

      .marquee .brand-lockup {
        position: absolute;
        left: 84px;
        top: 70px;
      }

      .marquee .headline {
        position: absolute;
        left: 84px;
        top: 146px;
        max-width: 650px;
        font-size: 76px;
      }

      .marquee .subhead {
        position: absolute;
        left: 88px;
        top: 342px;
        max-width: 555px;
        font-size: 24px;
      }

      .marquee .pill-row {
        position: absolute;
        left: 84px;
        bottom: 78px;
        display: flex;
        gap: 12px;
      }

      .marquee .mock-panel {
        right: 86px;
        top: 70px;
        width: 464px;
        height: 420px;
        border-radius: 22px;
        padding: 26px;
      }

      .marquee .group-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .marquee .group-card {
        min-height: 74px;
        padding: 14px 16px;
      }

      .marquee .group-copy strong {
        font-size: 20px;
      }

      .marquee .group-copy span {
        margin-top: 4px;
        font-size: 14px;
      }

      .rule-map {
        position: absolute;
        inset: 26px;
      }

      .rule-source,
      .rule-target {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid rgba(31, 41, 51, 0.12);
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
        font-weight: 760;
        box-shadow: 0 10px 24px rgba(31, 41, 51, 0.07);
      }

      .variant-c .rule-source,
      .variant-c .rule-target {
        color: #f6f4e8;
        border-color: rgba(246, 244, 232, 0.14);
        background: rgba(246, 244, 232, 0.08);
      }

      .rule-line {
        position: absolute;
        height: 2px;
        background: linear-gradient(90deg, var(--cyan), var(--leaf));
        transform-origin: left center;
      }

      .small .rule-source,
      .small .rule-target {
        width: 62px;
        height: 27px;
        font-size: 8px;
      }

      .small .rule-source.one {
        left: 0;
        top: 10px;
      }

      .small .rule-source.two {
        left: 0;
        top: 55px;
      }

      .small .rule-source.three {
        left: 0;
        top: 100px;
      }

      .small .rule-target.one {
        right: 0;
        top: 26px;
      }

      .small .rule-target.two {
        right: 0;
        top: 92px;
      }

      .small .rule-line.one {
        left: 60px;
        top: 24px;
        width: 50px;
        transform: rotate(8deg);
      }

      .small .rule-line.two {
        left: 60px;
        top: 68px;
        width: 50px;
        transform: rotate(-10deg);
      }

      .small .rule-line.three {
        left: 60px;
        top: 114px;
        width: 50px;
        transform: rotate(-22deg);
      }

      .marquee .rule-source,
      .marquee .rule-target {
        width: 176px;
        height: 54px;
        font-size: 18px;
      }

      .marquee .rule-source.one {
        left: 0;
        top: 24px;
      }

      .marquee .rule-source.two {
        left: 0;
        top: 146px;
      }

      .marquee .rule-source.three {
        left: 0;
        top: 268px;
      }

      .marquee .rule-target.one {
        right: 0;
        top: 62px;
      }

      .marquee .rule-target.two {
        right: 0;
        top: 238px;
      }

      .marquee .rule-line.one {
        left: 168px;
        top: 52px;
        width: 210px;
        transform: rotate(6deg);
      }

      .marquee .rule-line.two {
        left: 168px;
        top: 174px;
        width: 210px;
        transform: rotate(-6deg);
      }

      .marquee .rule-line.three {
        left: 168px;
        top: 296px;
        width: 210px;
        transform: rotate(-18deg);
      }

      .variant-b .mock-panel {
        background: rgba(255, 255, 255, 0.72);
      }

      .variant-b.small .headline {
        max-width: 212px;
      }

      .variant-b .headline {
        color: #17384a;
      }

      .variant-b .pill:first-child {
        color: #17384a;
      }

      .variant-c.small .headline {
        max-width: 218px;
        font-size: 32px;
      }

      .variant-c .headline {
        color: #f6f4e8;
      }

      .variant-c .brand-icon {
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="canvas" id="canvas">
      <div class="brand-lockup">
        <img class="brand-icon" src="../../src/assets/icons/tab-manager-icon-512.png" alt="" />
        <span>Auto Tab Groups</span>
      </div>

      <h1 class="headline" id="headline"></h1>
      <p class="subhead" id="subhead"></p>

      <div class="pill-row" id="pillRow"></div>
      <section class="mock-panel" id="mockPanel"></section>
    </main>

    <script>
      const variants = {
        command: {
          className: "variant-a",
          small: {
            headline: "Auto-group tabs",
            subhead: "Website, topic, domain, and rules.",
            pills: ["Website", "Rules"],
            panel: "groups"
          },
          marquee: {
            headline: "Auto-group tabs",
            subhead: "Organize tabs by website, topic, domain, and custom rules. Search and clean up from one workspace.",
            pills: ["Website type", "Custom rules", "Side panel"],
            panel: "groups"
          }
        },
        rules: {
          className: "variant-b",
          small: {
            headline: "Rules sort tabs for you",
            subhead: "Custom groups, websites, and priority.",
            pills: ["No dragging", "Auto rules"],
            panel: "rules"
          },
          marquee: {
            headline: "Rules sort tabs for you",
            subhead: "Create custom groups, add websites, and let matching rules route each new tab automatically.",
            pills: ["Custom groups", "Website lists", "Priority"],
            panel: "rules"
          }
        },
        dark: {
          className: "variant-c",
          small: {
            headline: "Tabs organize themselves",
            subhead: "Auto groups for busy Chrome sessions.",
            pills: ["AI", "Work", "Shopping"],
            panel: "groups"
          },
          marquee: {
            headline: "Tabs organize themselves",
            subhead: "Auto Tab Groups keeps research, work, shopping, AI, and learning tabs in the right place.",
            pills: ["Auto groups", "Smart views", "Tab history"],
            panel: "groups"
          }
        }
      };

      const params = new URLSearchParams(window.location.search);
      const variantKey = params.get("variant") || "command";
      const sizeKey = params.get("size") || "small";
      const variant = variants[variantKey] || variants.command;
      const content = variant[sizeKey] || variant.small;
      const canvas = document.getElementById("canvas");
      const headline = document.getElementById("headline");
      const subhead = document.getElementById("subhead");
      const pillRow = document.getElementById("pillRow");
      const mockPanel = document.getElementById("mockPanel");

      document.body.className = `${sizeKey} ${variant.className}`;
      canvas.className = `canvas ${sizeKey} ${variant.className}`;
      headline.textContent = content.headline;
      subhead.textContent = content.subhead;
      pillRow.innerHTML = content.pills
        .map((pill) => `<span class="pill"><span class="dot"></span>${pill}</span>`)
        .join("");

      function groupPanel() {
        return `
          <div class="group-stack">
            <div class="group-card">
              <div class="group-copy"><strong>AI</strong><span>openai.com · claude.ai</span></div>
              <span class="count">8</span>
            </div>
            <div class="group-card">
              <div class="group-copy"><strong>Development</strong><span>github.com · docs</span></div>
              <span class="count">12</span>
            </div>
            <div class="group-card">
              <div class="group-copy"><strong>Shopping</strong><span>amazon.com · deals</span></div>
              <span class="count">5</span>
            </div>
            <div class="group-card">
              <div class="group-copy"><strong>Learning</strong><span>research · notes</span></div>
              <span class="count">7</span>
            </div>
          </div>
        `;
      }

      function rulesPanel() {
        return `
          <div class="rule-map">
            <div class="rule-source one">github.com</div>
            <div class="rule-source two">openai.com</div>
            <div class="rule-source three">notion.so</div>
            <div class="rule-line one"></div>
            <div class="rule-line two"></div>
            <div class="rule-line three"></div>
            <div class="rule-target one">Work</div>
            <div class="rule-target two">AI</div>
          </div>
        `;
      }

      mockPanel.innerHTML = content.panel === "rules" ? rulesPanel() : groupPanel();
    </script>
  </body>
</html>
